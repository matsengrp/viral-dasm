# DASM2 model catalog.
#
# Scope: this catalog holds *neutral* models (and tokenizer assets). It is a
# superset of the neutral models netam.pretrained shipped (the three Thrifty
# models below). The two pretrained multihit-correction models are kept in
# dasm2/pretrained.py (PRETRAINED_MULTIHIT_MODELS), since they are three-float
# weight tuples rather than archives.
#
# netam.pretrained also ships three *selection* models (DNSMHumV1.0-1M,
# DNSMHumV1.0-4M, DASMHumV1.0-4M). These are intentionally NOT in the catalog:
# DASM2 trains its own selection models and has no path that loads netam's
# pretrained selection weights, so there is nothing here to resolve them for.
version: 1
models:
  # ThriftySHM neutral models (repackaged from netam thrifty-models v0.2.0 by
  # scripts/build_thrifty_neutral_models.py), hosted in matsengrp/dasm2-models
  # under neutral_models/thrifty/. The committed copies under
  # data/neutral/neutral_models/ are byte-identical to the hosted archives; the
  # sha256 below matches both. -20/-45 are IndepRSCNNModel; -59 is JoinedRSCNNModel.
  #
  # Naming convention (intended going forward): the catalog `path` basename
  # matches the committed filename under data/neutral/neutral_models/, so the
  # test fixture (_ensure_thrifty_archives_cached) can seed the cache by name.
  # The older flu/SCoV2 entries predate this and use mismatched basenames.
  - name: ThriftyHumV0.2-20
    model_type: neutral_model
    path: neutral_models/ThriftyHumV0.2-20.zip
    url: https://raw.githubusercontent.com/matsengrp/dasm2-models/8a1c6d04d29d4d0fdd364926be3117fdb679e4bd/neutral_models/thrifty/ThriftyHumV0.2-20.zip
    sha256: 219f71c309b210bd4bf1684a7e3ddc73f1d590405f4b30608f3b560dd711b337
    description: "Thrifty SHM model (20-feature human, v0.2.0; independent rate/CSP CNNs)"

  - name: ThriftyHumV0.2-45
    model_type: neutral_model
    path: neutral_models/ThriftyHumV0.2-45.zip
    url: https://raw.githubusercontent.com/matsengrp/dasm2-models/8a1c6d04d29d4d0fdd364926be3117fdb679e4bd/neutral_models/thrifty/ThriftyHumV0.2-45.zip
    sha256: c1d2b1ee3a9dbe97573de1b7178be5b43d411267acce1608e7ae13499098d7fd
    description: "Thrifty SHM model (45-feature human, v0.2.0; independent rate/CSP CNNs)"

  - name: ThriftyHumV0.2-59
    model_type: neutral_model
    path: neutral_models/ThriftyHumV0.2-59.zip
    url: https://raw.githubusercontent.com/matsengrp/dasm2-models/8a1c6d04d29d4d0fdd364926be3117fdb679e4bd/neutral_models/thrifty/ThriftyHumV0.2-59.zip
    sha256: 0b738f4c91417ead5102031d20d5150893a10fa583c0c811c84f824ae73c1bc3
    description: "Thrifty SHM model (59-feature human, v0.2.0; joined rate/CSP CNN; default SHM model)"

  # S5F five-mer SHM models (SHazaM; Yaari et al. 2013), hosted in
  # matsengrp/dasm2-models under neutral_models/s5f/, built from the exported
  # .rda TargetingModel tables by scripts/build_s5f_neutral_models.py --from-shazam.
  # HH = Human Heavy chain (HH_S5F); HKL = Human Kappa+Lambda light chain (HKL_S5F).
  # The source mutabilities are relative rates normalized to sum to 1 over the
  # 1024 N-free five-mers; the builder maps rate = mutability directly (branch
  # length absorbs the global scale). Each hosted archive also bundles its raw
  # source CSVs under source/ for provenance (unused at load time).
  - name: S5F-HH-classic-v1
    model_type: neutral_model
    path: neutral_models/S5F-HH-classic-v1.zip
    url: https://raw.githubusercontent.com/matsengrp/dasm2-models/a8a87ff345bb6891f9bf02ea731a2363cc8c0ef8/neutral_models/s5f/S5F-HH-classic-v1.zip
    sha256: b0caa0ebc4a49281a218508dd34c08671fcc93ad7f1a3aaded380b5b51d6a120
    description: "S5F five-mer SHM model (SHazaM HH_S5F, human heavy chain; Yaari et al. 2013). Source mutabilities normalized to sum to 1 over the 1024 N-free five-mers."

  - name: S5F-HKL-classic-v1

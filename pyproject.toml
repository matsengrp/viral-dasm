[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-dasm"
version = "0.1.0"
description = "Trains a DASM from mat-pcp PCPs and builds every figure in the viral-DASM manuscript"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

# `dasm2` here is this repository's own vendored fork (see dasm2/PROVENANCE.md),
# not a published package. It is deliberately absent from this list; tests/
# test_fork.py fails if it ever reappears or if `import dasm2` resolves outside
# this tree.
dependencies = [
    "biopython",
    "entmax>=1.3",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow>=25",
    "pydantic>=2.0",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "seaborn",
    "torch",
    "tqdm",
    "typing_extensions",
    # `dasm2/tokenizers.py` and `dasm2/training/compute_backend.py` import
    # these. Nothing viral-dasm trains uses the ESM2 path they serve, but the
    # imports are at module scope, so dropping the dependencies means editing
    # the vendored tree rather than this list.
    "accelerate>=1.0.0",
    "transformers>=4.30.0",
]

[dependency-groups]
dev = ["pytest", "pytest-timeout", "ruff>=0.16.9", "snakemake", "pulp<2.8", "marimo>=0.17", "altair>=5.5.0", "vl-convert-python>=1.7"]

[tool.setuptools.packages.find]
include = ["dasm2*"]

[tool.setuptools.package-data]
dasm2 = ["*.yaml"]

[tool.ruff]
line-length = 88
# The vendored fork is excluded on purpose. Reformatting it would make a diff
# against the commit in dasm2/PROVENANCE.md meaningless, which is the one
# thing that lets a reader check what the port changed.
extend-exclude = ["dasm2"]

[tool.ruff.lint.per-file-ignores]
# A marimo cell is a function whose contract is to `return` the names later
# cells read, so a cell that exports nothing ends in a bare `return`
# (PLR1711), and a cell that renders a widget ends in that widget as a bare
# expression (B018). Both are marimo's file format, not dead code.
"notebooks/*.py" = ["PLR1711", "B018"]

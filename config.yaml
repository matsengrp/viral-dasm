# Every path the pipeline reads, in one file.
#
# viral-dasm resolves nothing. There is no manifest lookup, no artifact-root
# default, no registry: a path the pipeline uses appears here or it does not
# exist. A reader with their own GISAID access edits this file to point at
# their own mat-pcp run and the pipeline follows.
#
# GISAID: everything under `mat_pcp`, `corpora` and `smoke_corpus` is
# GISAID-derived and stays on the cluster. `dms` is the exception -- three
# published datasets, which a reader can fetch themselves. Nothing
# GISAID-derived is published; the pipeline's own outputs that are publishable
# go to `results/`, which is tracked. `data/` is input only.

# Where the pipeline writes. Large, and not in the repository.
artifact_root: /fh/fast/matsen_e/shared/bcr-mut-sel/dasm2/experiments/viral-dasm

# The mat-pcp run this paper is built on.
#
# The first five files are TrainingConfig fields, rendered into each training
# config rather than read by viral-dasm itself. The four GLM tables below them
# are read by the neutral-model build (`workflow/corpus.smk::build_neutral`),
# which is the one stage that needs mat-pcp's fitted counts rather than its
# PCPs.
mat_pcp:
    root: /fh/fast/matsen_e/shared/viral-dasm/mat-pcp/results/gisaid-and-public_2026-08-06_v12
    manifest: s2SpikeGisaidAll-2026-08-06-v12
    gene: S
    censored_mutations_file: pcps/S/censored_mutations.csv
    censored_clades_file: pcps/S/censored_mutations.clades.txt
    masked_nt_sites_file: pcps/S/masked_nt_sites.csv
    reference_sequence_file: clade_founders/S/19A.fa
    censor_mode: both
    # The fitted mutation-rate tables, one per era plus the pooled fit. The
    # era partition is viral-dasm's own choice (see `data/eras-pre-omicron-omicron.yaml`); these
    # are the inputs it picks between, not the partition itself.
    master_table_file: glm/master_table.csv
    master_table_pre_omicron_file: glm/master_table_pre_omicron.csv
    master_table_omicron_file: glm/master_table_omicron.csv
    # Per-site counts the rate tables are applied against. 748 MB.
    site_annotations_file: glm/annotated_counts.csv
    # Which clades each era's GLM was actually fitted over. The era partition is
    # read from here rather than restated, so the corpus and the rate tables
    # cannot drift apart.
    era_fit_summary_file: glm/era_fit_summary.csv
    # The counts-based amino-acid fitness effects every scored model is read
    # against, and the founders the models are scored *on*.
    #
    # Full depth for every arm, the capped ones included. For the subsampling
    # figure the full-depth counts estimate is the yardstick a thinned-corpus
    # model is measured against, so the per-arm refits that also live under
    # `aamut_fitness/` (`cap_5000_0/`, `cap_20000_0/`, `cap_50000_0/`) are a
    # different comparison and are not read here. That is why the directory is
    # globbed for `*_aamut_fitness.csv` at its top level rather than walked.
    aamut_fitness_dir: aamut_fitness
    # The clade-pooled table, which has no `cluster` column and carries
    # `source_clade` instead. Named separately because it sits inside
    # `aamut_fitness_dir` and the per-clade glob has to exclude it: its column
    # order differs, so a glob that swept it in would read serine rows as
    # clade-founder rows.
    aamut_fitness_pooled_file: aamut_fitness/all_aamut_fitness.csv
    # Sequences per clade, as the tree was built: one row per Nextstrain
    # clade, with the count `mat/clades/{clade}_samples.txt` has lines. Read by
    # `fig:subsampling`'s panel A, which is the sampling imbalance the whole
    # figure is about.
    #
    # 58 rows against this run's 56 founders: `21A` and `25I` have a count here
    # and no founder, so nothing else in this pipeline scores them. The panel
    # plots `lib.clade_roster()` and drops those two.
    #
    # NOT `mat/clade_counts_by_cutoff.csv`, whose `cutoff` column is the
    # cutoff-date ladder (2020-09-01 .. 2025-07-01) and never this run's
    # 2026-08-06, so a filter on it returns an empty frame rather than raising.
    clade_counts_file: mat/clade_counts.csv
    # The per-clade nucleotide grids: every single-nucleotide mutation away
    # from the clade founder, with its actual and expected count. Panel B's
    # eCDF is a marginal over this grid, and the three `cap_*_0/`
    # subdirectories hold the same grid counted on each thinned tree.
    #
    # Separate from `aamut_fitness_dir` because it is the nucleotide grid, not
    # the amino-acid table: the grid is the population the paper's "mutations
    # with at least X counts" is a share *of*, and it does not depend on
    # sampling depth, which is what makes the depth curves comparable.
    ntmut_fitness_dir: fitness/ntmut_fitness
    # One `{clade}.fa` per clade. The clade roster is read from these files
    # rather than restated anywhere, and `scripts/check_clades.py` requires the
    # founders, the per-clade fitness tables and `censored_clades_file` to name
    # the same set.
    clade_founders_dir: clade_founders/S
    # One `{clade}_sample_paths.tsv` per clade: one row per leaf, holding that
    # leaf's whole root-to-tip path as `node_id:NT_MUT[,NT_MUT...]` tokens.
    # `fig:dms`'s leaf log-frequency predictor reconstructs each leaf's spike
    # from these and tallies residues per site.
    #
    # The per-leaf paths, not `{clade}_mutations.tsv`'s `aa_mutations` column,
    # which would skip the nucleotide step: 964 of clade 24E's 88,722 distinct
    # path tokens have no row in that file at all, so those branches'
    # substitutions would be dropped with nothing saying so. Nor
    # `leaves_sharing_mutations`, which would skip the per-leaf expansion: a
    # leaf's residue at a site is set by the *last* mutation on its path, so
    # reversions and repeat hits break a weighted tally.
    #
    # GISAID-derived, and the only file here whose rows carry sample names. The
    # tally built from it stays under `artifact_root`; see `README.md`.
    sample_paths_dir: mutations
    # The run's axes, spelled out rather than parsed back out of `manifest`.
    # They appear in every neutral archive's stem and in the era map's
    # `neutral_model_name`, which is the only record in a finished Parquet of
    # which neutral model produced it.
    cutoff: "2026-08-06"
    version: v12

# The prepared corpora.
#
# `full_depth` is BUILT, not pinned -- and the paper's 90/10 split survives the
# rebuild. Fold 0 is a row-positional draw: the held-out index set comes from
# (seed, num_folds, n_rows), and which PCP sits at each index comes from the
# Parquet's row order. That row order is copied verbatim from the mat-pcp PCP
# file below; nothing in the builder sorts, samples or shuffles. Verified by
# comparing the first 50,000 rows of each: 50,000/50,000 positionally
# identical on (clade, parent, child).
#
# So what has to be pinned is the mat-pcp file, not the Parquet. That file is
# an input viral-dasm receives rather than produces, and its md5 is checked
# before anything is built from it.
#
# The Parquet's own md5 is recorded but NOT a gate. A rebuild recomputes
# `nt_rates` and `nt_csps` and picks its own row-group boundaries and
# compression, so the file's bytes may move while every row stays where it
# was. The row-order digest is what the split depends on, and it is the hard
# check.
#
# The three thinned arms are BUILT by this pipeline, into `artifact_root`.
# They have no reference curve to match and draw their own folds, so they
# record no `md5`: there is no pinned file for a rebuild to be compared
# against, and the row-order digest is the check that matters anyway.
#
# `n_train`/`n_val` are per corpus because the fold draw sizes itself from
# `n_rows`. `cv_split` below holds only what every arm shares: the seed, the
# number of folds, and which one is held out.
corpora:
    full_depth:
        path: /fh/fast/matsen_e/shared/bcr-mut-sel/dasm2/experiments/2026-09-02-v12-sampling-depth-ladder/parquet/S/full_depth.parquet
        n_rows: 1594774
        # The mat-pcp output this corpus is built from, and whose row order it
        # inherits. This is the pin that matters.
        source_pcp: /fh/fast/matsen_e/shared/viral-dasm/mat-pcp/results/gisaid-and-public_2026-08-06_v12/pcps/S/all_pcps_dasm_ready.csv.gz
        source_pcp_manifest: s2SpikeGisaidAll-2026-08-06-v12
        source_pcp_md5: abbe9c756e74b07c8ff387c98bec573b
        # blake2b-128 over the stream of per-row blake2b(clade\tparent\tchild, 16)
        # digests, in row order. Order-sensitive on purpose: a sorted or
        # set-based digest would pass on a reordered file, and a reordered file
        # is a different 90/10 split.
        row_order_digest: 6ac408a82a1feb2a1d7d50fb0293a60b
        # Recorded, not gated. See above.
        md5: 54070366804c4dd487eda47e9a027f68
        # The row-group cache budget this file needs. The library's 2 GB
        # default caps the cache below the shuffle buffer's working set, and
        # the failure is silent: the run trains ~34x too slowly to finish.
        #
        # Computed, not chosen: `scripts/lib.py::parquet_cache_budget_gb` on
        # the file itself. `cap_5000_0` lands lower because it has only 27 row
        # groups, so the floor of 40 wins over `default_cache_row_groups`.
        parquet_cache_budget_gb: 7.27
        n_train: 1435362
        n_val: 159412

    # The thinned arms. Each is a mat-pcp aggregate in its own right: the
    # thinning happens there, and nothing in this pipeline filters, subsamples
    # or reshapes rows. That is why a rebuild reproduces the row order, and so
    # the fold, for these too.
    cap_50000_0:
        path: /fh/fast/matsen_e/shared/bcr-mut-sel/dasm2/experiments/viral-dasm/parquet/S/cap_50000_0.parquet
        n_rows: 377534
        source_pcp: /fh/fast/matsen_e/shared/viral-dasm/mat-pcp/results/gisaid-and-public_2026-08-06_v12/pcps/S/cap_50000_0/all_pcps_dasm_ready.csv.gz
        source_pcp_manifest: s2SpikeGisaidAll-cap_50000_0-2026-08-06-v12
        source_pcp_md5: 62ec8fe5079069956d4c26f85df9ffa9
        row_order_digest: cf4b8019de6235b6118eb6f11263f44d
        parquet_cache_budget_gb: 7.27
        n_train: 339895
        n_val: 37639

    cap_20000_0:
        path: /fh/fast/matsen_e/shared/bcr-mut-sel/dasm2/experiments/viral-dasm/parquet/S/cap_20000_0.parquet
        n_rows: 216146
        source_pcp: /fh/fast/matsen_e/shared/viral-dasm/mat-pcp/results/gisaid-and-public_2026-08-06_v12/pcps/S/cap_20000_0/all_pcps_dasm_ready.csv.gz
        source_pcp_manifest: s2SpikeGisaidAll-cap_20000_0-2026-08-06-v12
        source_pcp_md5: fd97a44d4b7e5e9da87b7676bfe4ad9f
        row_order_digest: 10b3b9d4bc5b364ffcaa4b10734a1243
        parquet_cache_budget_gb: 7.27
        n_train: 194701
        n_val: 21445

    cap_5000_0:
        path: /fh/fast/matsen_e/shared/bcr-mut-sel/dasm2/experiments/viral-dasm/parquet/S/cap_5000_0.parquet
        n_rows: 53897
        source_pcp: /fh/fast/matsen_e/shared/viral-dasm/mat-pcp/results/gisaid-and-public_2026-08-06_v12/pcps/S/cap_5000_0/all_pcps_dasm_ready.csv.gz
        source_pcp_manifest: s2SpikeGisaidAll-cap_5000_0-2026-08-06-v12
        source_pcp_md5: ce3991c6348f1ef76b1e576c442b8d98
        row_order_digest: 420dbb31e2e7df72e1272842adf2dde1
        parquet_cache_budget_gb: 7.09
        n_train: 48562
        n_val: 5335

# The neutral-model archives the pipeline builds, pinned by a digest of the
# `rates_table.csv` inside each one.
#
# These were computed from the archives the paper's models were trained
# against, on 2026-11-08. `verify_era_neutral_models.py` rebuilds the archives
# from `mat_pcp`'s GLM tables and requires the result to reproduce them, so the
# equality is a reproduction rather than a restatement of this pipeline's own
# output.
#
# NOT a digest of the member's bytes: of the table rendered canonically, rows
# sorted by key and each rate at 8 significant digits. The bytes record how a
# pandas version chose to print a float, not what the model says. No rate is
# recomputed between the two builds -- `select_gene_rates` masks rows out of
# the GLM master table and sorts them, with no arithmetic on rates -- but the
# pinned archives wrote about 16 significant digits where this environment
# writes the shortest round-trip repr, which is the master table's own string.
# Parsed back, the shorter text lands up to 4.43e-14 relative away. A byte
# digest calls that a changed model, and would again after every
# `uv lock --upgrade`. Eight digits is far below any rate-selection change,
# which moves rates by whole percent; the closest of these 1,152 rates sits
# 1.3e-11 from an 8-digit boundary, about 300x the rendering spread. That
# margin is a property of this rate table, not a designed tolerance.
#
# What this does not do is show the rates were right to begin with -- it
# records what was built. The round-trip check beside it carries that, by
# rebuilding the table from the GLM input. See `dasm2/PROVENANCE.md`.
#
# `rates_table.csv` rather than the zip's own bytes: a zip records mtimes, so
# two identical rate tables packed a minute apart give different archive
# digests and the check would fail on a legitimate rebuild.
neutral_archives:
    pre_omicron: b56cfa3c97606587c25f0151f9a354b87280481fe47bcc1d8a34369cb692250f
    omicron: 85478573d0fb18b133a47c41b7f631c828a9b478240a325c049f7d80d96071b9
    pooled: 076b311626e71dd469aa203c56f53a7c65665602f704e9114c48d7b9757b0aa2

# The wiring smoke's corpus: 400 PCPs spanning 46 clades and both eras, with
# the same `max_aa_seq_len` of 1,273 as every corpus the paper trains on.
#
# Received, not built. It is a slice of the sampling-depth ladder's own tree,
# and the smoke it serves is a wiring test -- config to dataset to
# tokenisation at the gene's real length to censor load to forward to backward
# to evaluation -- so what it needs is to be a real corpus of this gene, not to
# be a corpus of any particular size. Its fold-0 draw leaves about 40
# validation rows, which is enough to reach an evaluation and is not a
# measurement.
#
# The md5 is recorded, not gated -- the same standing `full_depth`'s has. What
# makes a changed file rerun the smoke is that this one is 866 KB, under
# snakemake's 1 MB checksum threshold, so its content is tracked rather than
# its mtime; the `smoke` rule therefore declares it plainly rather than
# `ancient()`. The md5 is here so a reader can identify the file this
# pipeline's smokes were run against.
#
# No `parquet_cache_budget_gb`: the file is 866 KB and the library's own 2 GB
# default covers it many times over, while `lib.parquet_cache_budget_gb`
# assumes a corpus with more row groups than this one has.
smoke_corpus:
    path: /fh/fast/matsen_e/shared/bcr-mut-sel/dasm2/experiments/2026-09-02-v12-sampling-depth-ladder/fast_test/S/fast_test.parquet
    md5: 72b90961147b20649a9ca59ff148d998

# The deep mutational scanning the model's fitness effects are compared against
# in `fig:dms`: full-spike cell-entry measurements on three homologs, each
# matched to the clade whose founder the model is scored on.
#
# The one block here that is NOT GISAID-derived. These are published datasets
# with their own papers, so a reader without GISAID access can still rebuild
# this figure, and the files may be redistributed. They are named as prepared
# CSVs rather than as the repositories they came from: the preparation --
# replicate averaging, the lasso shift, the `times_seen` filter -- belongs to
# whoever published them, and repeating it here would be a second, divergent
# definition of each dataset.
#
# `md5` is a gate, not a label, and it is the reason this block carries one at
# all. EPIC #1's M5 records that KP.3.1.1 should be repointed at filtered
# measurements, and that repoint replaces the file *at this same path*. Without
# a digest every retained-mutation count this figure reports would go stale
# silently, while the pipeline kept running.
#
# `clade` is the Nextstrain label this pipeline keys every table on, not the
# Pango alias the papers use. `scripts/dms.py` requires each one to be in
# `lib.clade_roster()`, so a homolog whose clade has no founder fails there
# rather than joining to nothing.
dms:
    root: /fh/fast/matsen_e/shared/bcr-mut-sel/functional-data
    homologs:
        BA.1:
            clade: 21K
            file: haddox_spike_Omicron_BA1.csv
            md5: 9f21c3ee991c1e7ea7a4362e510bc3c2
        XBB.1.5:
            clade: 23A
            file: dadonaite2024_XBB15_cell_entry.csv
            md5: 18c630548aa0e5d3b3a6e341bc8bbd26
        KP.3.1.1:
            clade: 24E
            file: dadonaite2025_KP311_cell_entry.csv
            md5: 6cb4e58c8e61831fac6f470325b68a7c

# The split every reference run held out, and every model in the paper holds
# out. Only the three numbers every arm shares live here; the resulting fold
# sizes are per corpus, because the draw sizes itself from that corpus's
# `n_rows`.
cv_split:
    num_folds: 10
    fold_index: 0
    seed: 42

# Training seed. 42 everywhere, so a run here is comparable to the reference.
train_seed: 42

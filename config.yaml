# Every path the pipeline reads, in one file.
#
# viral-dasm resolves nothing. There is no manifest lookup, no artifact-root
# default, no registry: a path the pipeline uses appears here or it does not
# exist. A reader with their own GISAID access edits this file to point at
# their own mat-pcp run and the pipeline follows.
#
# GISAID: everything under `inputs` and `corpora` is GISAID-derived and stays
# on the cluster. Nothing here is published; the pipeline's own outputs that
# are publishable go to `data/`, which is tracked.

# Where the pipeline writes. Large, and not in the repository.
artifact_root: /fh/fast/matsen_e/shared/bcr-mut-sel/dasm2/experiments/viral-dasm

# The mat-pcp run this paper is built on. These five files are TrainingConfig
# fields, rendered into each training config rather than read by viral-dasm
# itself.
mat_pcp:
    root: /fh/fast/matsen_e/shared/viral-dasm/mat-pcp/results/gisaid-and-public_2026-08-06_v12
    manifest: s2SpikeGisaidAll-2026-08-06-v12
    gene: S
    censored_mutations_file: pcps/S/censored_mutations.csv
    censored_clades_file: pcps/S/censored_mutations.clades.txt
    masked_nt_sites_file: pcps/S/masked_nt_sites.csv
    reference_sequence_file: clade_founders/S/19A.fa
    censor_mode: both

# The prepared corpora.
#
# `full_depth` is BUILT, not pinned -- and the paper's 90/10 split survives the
# rebuild. Fold 0 is a row-positional draw: the held-out index set comes from
# (seed, num_folds, n_rows), and which PCP sits at each index comes from the
# Parquet's row order. That row order is copied verbatim from the mat-pcp PCP
# file below; nothing in the builder sorts, samples or shuffles. Verified by
# comparing the first 50,000 rows of each: 50,000/50,000 positionally
# identical on (clade, parent, child).
#
# So what has to be pinned is the mat-pcp file, not the Parquet. That file is
# an input viral-dasm receives rather than produces, and its md5 is checked
# before anything is built from it.
#
# The Parquet's own md5 is recorded but NOT a gate. A rebuild recomputes
# `nt_rates` and `nt_csps` and picks its own row-group boundaries and
# compression, so the file's bytes may move while every row stays where it
# was. The row-order digest is what the split depends on, and it is the hard
# check.
#
# M2 adds the three thinned arms here. Those have no reference curve to match
# and draw their own folds.
corpora:
    full_depth:
        path: /fh/fast/matsen_e/shared/bcr-mut-sel/dasm2/experiments/2026-09-02-v12-sampling-depth-ladder/parquet/S/full_depth.parquet
        n_rows: 1594774
        # The mat-pcp output this corpus is built from, and whose row order it
        # inherits. This is the pin that matters.
        source_pcp: /fh/fast/matsen_e/shared/viral-dasm/mat-pcp/results/gisaid-and-public_2026-08-06_v12/pcps/S/all_pcps_dasm_ready.csv.gz
        source_pcp_manifest: s2SpikeGisaidAll-2026-08-06-v12
        source_pcp_md5: abbe9c756e74b07c8ff387c98bec573b
        # blake2b-128 over the stream of per-row blake2b(clade\tparent\tchild, 16)
        # digests, in row order. Order-sensitive on purpose: a sorted or
        # set-based digest would pass on a reordered file, and a reordered file
        # is a different 90/10 split.
        row_order_digest: 6ac408a82a1feb2a1d7d50fb0293a60b
        # Recorded, not gated. See above.
        md5: 54070366804c4dd487eda47e9a027f68
        # The row-group cache budget this file needs. The library's 2 GB
        # default caps the cache below the shuffle buffer's working set, and
        # the failure is silent: the run trains ~34x too slowly to finish.
        parquet_cache_budget_gb: 7.27

# The wiring test's corpus: a few hundred PCPs spanning both eras.
fast_test_corpus:
    path: /fh/fast/matsen_e/shared/bcr-mut-sel/dasm2/experiments/2026-09-02-v12-sampling-depth-ladder/fast_test/S/fast_test.parquet
    md5: 72b90961147b20649a9ca59ff148d998

# The split every reference run held out, and every model in the paper holds out.
cv_split:
    num_folds: 10
    fold_index: 0
    seed: 42
    n_train: 1435362
    n_val: 159412

# Training seed. 42 everywhere, so a run here is comparable to the reference.
train_seed: 42

# The dasm2-experiments runs M1 checks the port against. Not inputs to any
# figure -- they exist so the port can be shown not to have changed the model.
reference_runs:
    dasm-85k:
        experiment: 2026-09-21-v12-replicate-training
        run: rep0
        checkpoints_dir: /fh/fast/matsen_e/shared/bcr-mut-sel/dasm2/experiments/2026-09-21-v12-replicate-training/checkpoints/rep0/S/full_depth/transformer
        best_checkpoint: transformer_SelectionFactorHead-path_b2c98048_train_cycle0_best_run20260921-160509-78b6e5_fb100aef_20260922.zip
        best_checkpoint_md5: 7f40771defa159c67890518b75957d2e
        best_val_loss: 7.766710
        best_step: 412000
        stop_step: 436000
        stop_reason: "LR 9.77e-07 < 1.00e-06"
        n_loss_positions: 158137
        effective_params: 84884
